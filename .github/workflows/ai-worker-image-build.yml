name: AI worker image build

# Called by ai-worker-images.yml, which grants the permissions: packages: write only for
# push: true, on main. One job per CPU worker image (docs/ai/worker.md, "Images"):
#
#   1. one bake of the lean base, then the worker on it (ml/docker-bake.hcl), loaded into the
#      runner's Docker and, when pushing, also pushed to GHCR by digest, untagged, from the same
#      build. The push happens here, before the checks;
#   2. the smoke test in the loaded copy (no weights, no network) and a size scan of its files;
#   3. when pushing and both passed: the registry's image checked against the one tested, the
#      sha- tags put on that digest, and only then the digest written to the summary.
#
# Trade-off, accepted (docs/ai/worker.md, "Images"): a run on main that fails a check leaves its
# image in GHCR, untagged and in no summary. Nothing deletes it. Each build context is an
# allow-list that never holds weights, and the server only runs a digest copied from a
# successful run's summary. Deleting it was left out. It is not known that GITHUB_TOKEN may
# delete a user-owned package's versions, and the index's platform manifest is a version shared
# with any earlier build of the same content, so a deletion could break an image in use.

on:
  workflow_call:
    inputs:
      push:
        description: push the tested build to GHCR (main only)
        type: boolean
        required: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kev-worker-cpu
            base: kev-cpu-lean
            model: kev
            licence: /opt/kev/LICENSE
          - image: pplx-worker-cpu
            base: pplx-cpu-lean
            model: pplx
            licence: /opt/pplx/LICENSE /opt/pplx/NOTICE
    env:
      PUSH: ${{ inputs.push }}
      TARGET: ${{ matrix.image }}
      BASE: ${{ matrix.base }}
      # The tested image's name in the runner's Docker only; never pushed under it.
      LOCAL: local/${{ matrix.image }}:tested
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # torch's CPU wheel and its neighbours are ~2.5 GB per image, held twice (the builder's
      # cache and the image loaded for the smoke test); the runner's preinstalled SDKs are not
      # needed here.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Repository name for GHCR
        id: prep
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/makhzan/$TARGET" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.repo }}
          # The labels go into the bake (as target <image>-meta in ml/docker-bake.hcl); the tags
          # do not: the registry gets them only after the smoke test, on the tested digest.
          bake-target: ${{ matrix.image }}-meta
          tags: |
            type=sha,format=long
            type=sha,format=short

      # The bake's --set lines. Every run reads the GHA cache; only main writes it, so pull
      # requests cannot evict main's layers. Every run loads the image as $LOCAL; main also
      # pushes the same build by digest. The target carries no tags: buildx would put them on
      # the pushed name, and a push by digest refuses a tagged name.
      - name: Plan the bake
        id: plan
        env:
          REPO: ${{ steps.prep.outputs.repo }}
        run: |
          {
            echo "set<<EOF"
            echo "$BASE.cache-from=type=gha,scope=$BASE"
            echo "$TARGET.cache-from=type=gha,scope=$TARGET"
            echo "$TARGET.tags="
            echo "$TARGET.output=type=docker,name=$LOCAL"
            if [ "$PUSH" = "true" ]; then
              echo "$BASE.cache-to=type=gha,mode=max,scope=$BASE"
              echo "$TARGET.cache-to=type=gha,mode=max,scope=$TARGET"
              echo "$TARGET.output=type=image,name=$REPO,push-by-digest=true,name-canonical=true,push=true"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base and then the worker on it, in one bake: the worker's FROM is the named context
      # target:<base>, never a registry tag.
      - name: Build (lean base, then the worker on it)
        id: build
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            ml/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ matrix.image }}
          set: ${{ steps.plan.outputs.set }}

      # No weights and no network: CPU-only torch, no fla, the model's code and pins present,
      # no weight-named file in the image, the entrypoint's --check, and a whole session against
      # the fake broker with a fake judge (ml/makhzan_ml/worker/smoke.py). Run under the home
      # server's container restrictions. Scoring parity needs the weights and stays the
      # supervised first run on the home server.
      - name: Smoke test (no weights, no network)
        env:
          MODEL: ${{ matrix.model }}
          LICENCE: ${{ matrix.licence }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python "$LOCAL" -m makhzan_ml.worker.smoke --model "$MODEL"
          # The upstream licence travels with the image.
          read -ra files <<<"$LICENCE"
          docker run --rm --network none --entrypoint sh "$LOCAL" -c \
            'for f in "$@"; do test -s "$f" || { echo "missing $f"; exit 1; }; done
             grep -q "Apache License" "$1"' sh "${files[@]}"
          size=$(docker image inspect -f '{{.Size}}' "$LOCAL")
          echo "IMAGE_MB=$(( size / 1000000 ))" >> "$GITHUB_ENV"

      # The smoke test looks for weights by name from inside; this looks by size from outside,
      # whatever a file is called: any regular file over 100 MB that is not a shared library
      # (torch's own are; a checkpoint shard is not) fails the build.
      - name: Size scan (no weight-sized file)
        run: |
          cid=$(docker create "$LOCAL")
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker export "$cid" | tar -tvf - > files.txt
          echo "largest files:"
          awk '$1 ~ /^-/' files.txt | sort -k3,3nr | awk 'NR <= 5'  # head would SIGPIPE sort
          awk '$1 ~ /^-/ && $3 > 100000000 && $0 !~ /\.so(\.[0-9]+)*$/ { print "too large: " $0; bad = 1 }
               END { exit bad }' files.txt

      # The registry's image must be the one just tested: its config (layers' diff ids
      # included) is the loaded image's.
      - name: Check the pushed image is the tested one
        if: inputs.push
        env:
          REPO: ${{ steps.prep.outputs.repo }}
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          digest=$(jq -r --arg t "$TARGET" '.[$t]["containerimage.digest"] // empty' <<<"$METADATA")
          case "$digest" in sha256:*) ;; *) echo "no digest in the bake metadata"; exit 1 ;; esac
          raw=$(docker buildx imagetools inspect --raw "$REPO@$digest")
          manifest=$digest
          if jq -e '.manifests' <<<"$raw" >/dev/null; then
            manifest=$(jq -r '.manifests[] | select(.platform.os == "linux" and
              .platform.architecture == "amd64") | .digest' <<<"$raw")
            raw=$(docker buildx imagetools inspect --raw "$REPO@$manifest")
          fi
          config=$(jq -r '.config.digest' <<<"$raw")
          loaded=$(docker image inspect -f '{{.Id}}' "$LOCAL")
          echo "pushed $digest (manifest $manifest, config $config); loaded $loaded"
          # The classic image store names an image by its config, the containerd one by its
          # manifest or index.
          case "$loaded" in "$config" | "$manifest" | "$digest") ;;
            *) echo "the registry's image is not the one tested"; exit 1 ;; esac
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      # The sha- tags go on the tested digest only now; imagetools copies the manifest as is.
      - name: Tag the tested digest
        if: inputs.push
        env:
          REPO: ${{ steps.prep.outputs.repo }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "$REPO@$DIGEST"
          while read -r tag; do
            [ -n "$tag" ] || continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ "$got" = "$DIGEST" ] || { echo "$tag points at $got, not $DIGEST"; exit 1; }
          done <<<"$TAGS"

      - name: Summary (digest to pull)
        env:
          REPO: ${{ steps.prep.outputs.repo }}
        run: |
          {
            echo "### $TARGET"
            echo
            echo "Built from \`$GITHUB_SHA\`, smoke test and size scan passed, ${IMAGE_MB} MB uncompressed."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUSH" != "true" ]; then
            echo "Not pushed (only runs on main push)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '```bash'
            echo "docker pull $REPO@$DIGEST"
            echo "MAKHZAN_IMAGE=$REPO@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$REPO@$DIGEST"
