name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff silently changes its own lint and format rules,
      # which turned CI red on untouched files. Keep in step with poetry.lock.
      - run: pip install ruff==0.15.21
      - name: Ruff check
        run: ruff check packages apps/api apps/ingestion scripts
      - name: Ruff format check
        run: ruff format --check packages apps/api apps/ingestion scripts

  tests:
    name: Ingestion tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: makhzan
          POSTGRES_PASSWORD: makhzan
          POSTGRES_DB: makhzan
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - name: Install
        working-directory: apps/ingestion
        run: poetry install
      - name: Pytest
        working-directory: apps/ingestion
        # conftest creates the test database itself; this only needs a reachable server.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://makhzan:makhzan@localhost:5432/makhzan_test
        run: poetry run pytest

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: makhzan
          POSTGRES_PASSWORD: makhzan
          POSTGRES_DB: makhzan
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - name: Install
        working-directory: apps/api
        run: poetry install
      - name: Pytest
        working-directory: apps/api
        # conftest creates the test database itself; this only needs a reachable
        # server. A different database than the ingestion suite's, so the jobs
        # stay independent even if they ever share a server.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://makhzan:makhzan@localhost:5432/makhzan_api_test
        run: poetry run pytest

  e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # No Postgres, Meilisearch or Python: the app talks to a stub API
      # (tests/e2e/stub-api.mjs), so this suite tests the frontend and cannot
      # fail because the catalogue changed.
      - name: Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  web:
    name: Web lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      # action-setup reads "packageManager" from the repo root by default, and the
      # only package.json lives in apps/web — point it there rather than pinning
      # the version twice.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api
