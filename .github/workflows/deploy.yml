name: Deploy

# Manual trigger, or automatically when a GitHub Release is published.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # deploy.sh does the git pull itself; the one here is the bootstrap,
          # so a server still running an older deploy.sh gets the current one.
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            ./scripts/deploy.sh
