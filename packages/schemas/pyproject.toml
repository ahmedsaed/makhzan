[project]
name = "makhzan-schemas"
version = "0.1.0"
description = "Shared data layer for makhzan — SQLAlchemy models, contracts, enums"
authors = [{ name = "makhzan" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
]

[tool.poetry]
packages = [{ include = "makhzan_schemas" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
