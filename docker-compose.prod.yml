# Production stack for makhzan (Docker Compose).
#
#   cp .env.prod.example .env.prod   # then edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Images are pulled from a registry (built + pushed by CI). Each service also
# has a `build:` block so you can build on the server instead:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#
# TLS / reverse proxy is handled externally (managed by you). Only the web app
# is published (WEB_PORT) for your proxy to front; the API is internal and the
# web service proxies /api to it (Next.js rewrites). The AI broker is bound
# to BROKER_BIND, the server's Tailscale address, and reached only over
# Tailscale (docs/ai/broker-deploy.md). db / search / redis are internal-only. Data lives in named volumes (docker volume ls).
#
# The services read ${MAKHZAN_ENV_FILE:-.env.prod}: backup-db.sh and restore-db.sh set
# MAKHZAN_ENV_FILE so a throwaway stack (its own COMPOSE_PROJECT_NAME and env file) can
# be used to try them without touching production.

x-restart: &restart
  restart: unless-stopped

# The supplier configuration (sources.toml, crosswalks/, bespoke adapters) is not
# in this repository or its images: it is a private checkout beside this one,
# mounted read-only into the two services that read it. deploy.sh pulls it.
# create_host_path is off so a missing checkout fails the deploy instead of
# Docker creating an empty directory and the sync finding no sources file.
x-private-config: &private-config
  volumes:
    - type: bind
      source: ${MAKHZAN_CONFIG_DIR:-../makhzan-config}
      target: /workspace/private
      read_only: true
      bind:
        create_host_path: false
  environment:
    MAKHZAN_SOURCES: /workspace/private/sources.toml
    MAKHZAN_CROSSWALKS: /workspace/private/crosswalks
    PYTHONPATH: /workspace/private

services:
  db:
    image: postgres:16
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  search:
    image: getmeili/meilisearch:v1.9
    <<: *restart
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data

  # One-shot: apply Alembic migrations and seed the sources table from
  # sources.toml, then exit. api/ingestion wait for success. The sync is part of
  # every deploy because the worker reads the table, not the file: without it a
  # source added to the file would never run, and a fresh database would crawl
  # nothing at all.
  migrate:
    image: ${IMAGE_PREFIX}/ingestion:${IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
      target: prod
    <<: *private-config
    env_file: ${MAKHZAN_ENV_FILE:-.env.prod}
    command:
      - sh
      - -c
      - >-
        cd /workspace/packages/schemas && alembic upgrade head &&
        cd /workspace/apps/ingestion && python -m worker.sources.sync &&
        python -m worker.ensure_index
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_started
    restart: "no"

  api:
    image: ${IMAGE_PREFIX}/api:${IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    <<: *restart
    env_file: ${MAKHZAN_ENV_FILE:-.env.prod}
    # Not published — the web service proxies /api to it over the internal
    # network (see web.API_INTERNAL_URL). Expose a port here only if you need to
    # reach the API directly from outside.
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The AI broker (docs/ai/broker-api.md, docs/ai/broker-deploy.md): the only
  # thing AI workers talk to. The API image with its own app object and port,
  # never behind the web's /api rewrite (P2). Reached only over Tailscale:
  # BROKER_BIND is the server's Tailscale IP and port (default loopback, so
  # nothing outside the host reaches it until set). The tailscale interface
  # must be up before this container starts, or Docker cannot bind the
  # address. It runs no model; it renders requests, leases jobs, stores scores.
  broker:
    image: ${IMAGE_PREFIX}/api:${IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    <<: *restart
    # Only what it uses, not the whole env file: the broker faces the
    # internet, so it holds no signing key, search key or report salt.
    # Interpolated from the same --env-file every other service reads.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_BROKER_ADMIN_TOKEN_SHA256: ${AI_BROKER_ADMIN_TOKEN_SHA256:-}
      AI_BROKER_MAX_BODY: ${AI_BROKER_MAX_BODY:-262144}
      REBUILD_WINDOW_SECONDS: ${REBUILD_WINDOW_SECONDS:-600}
    command: ["uvicorn", "app.broker.main:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "${BROKER_BIND:-127.0.0.1:8100}:8100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8100/ai/v1/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion:
    image: ${IMAGE_PREFIX}/ingestion:${IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
      target: prod
    <<: [*restart, *private-config]
    env_file: ${MAKHZAN_ENV_FILE:-.env.prod}
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # The internal admin dashboard (docs/admin.md): the ingestion image, which
  # holds the status report and the CLI code it reuses, with its own app object
  # and port. Reached only over Tailscale, like the broker: ADMIN_BIND is the
  # server's Tailscale IP and port (default loopback). No public proxy, never
  # behind the web's /api rewrite. It deploys and restarts nothing; its long
  # jobs (a limit= run, the probe, a regroup dry run) go to the worker's queue.
  # It mounts the private configuration read-only: the report loads the
  # adapters and crosswalks. It holds no crawler signing key.
  admin:
    image: ${IMAGE_PREFIX}/ingestion:${IMAGE_TAG}
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
      target: prod
    <<: [*restart, *private-config]
    environment:
      MAKHZAN_SOURCES: /workspace/private/sources.toml
      MAKHZAN_CROSSWALKS: /workspace/private/crosswalks
      PYTHONPATH: /workspace/private
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MEILI_URL: ${MEILI_URL:-http://search:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      SITE_URL: ${SITE_URL:-}
      CRAWL_ENABLED: ${CRAWL_ENABLED:-true}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ADMIN_NAME: ${ADMIN_NAME:-admin}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-}
    command: ["uvicorn", "admin.app:app", "--host", "0.0.0.0", "--port", "8200"]
    ports:
      - "${ADMIN_BIND:-127.0.0.1:8200}:8200"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG}
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        # Where the browser reaches the API (baked in at build). "/api" if your
        # proxy maps it on the web origin; else an absolute URL. See .env.prod.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    <<: *restart
    # Next.js rewrites /api/* to the API over the internal network. SITE_URL is
    # the public origin for canonical links and structured data; read at
    # runtime, so it is set here rather than baked into the image.
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      SITE_URL: ${SITE_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Next's data cache (the `revalidate` results in lib/api.ts) lives under
    # .next/cache. Without a volume it is part of the container, so every deploy
    # starts cold and the first visitor pays for the whole taxonomy again —
    # /categories groups over every product row. Photos are not in here: they
    # load straight from the supplier (docs/decisions/0003).
    volumes:
      - web_cache:/app/.next/cache
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  meili_data:
  redis_data:
  web_cache:
