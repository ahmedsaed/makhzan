[project]
name = "makhzan-ingestion"
version = "0.1.0"
description = "makhzan ingestion worker — scrapers, normalization, review queue"
authors = [{ name = "makhzan" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "arq>=0.26,<1.0",
    "httpx>=0.27,<1.0",
    "selectolax>=0.3,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "meilisearch>=0.31,<1.0",
    "makhzan-schemas",
]

[tool.poetry]
packages = [{ include = "worker" }]

# Source for the path dependency (editable within the monorepo).
[tool.poetry.dependencies]
makhzan-schemas = { path = "../../packages/schemas", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = "*"
pytest = "*"
pytest-asyncio = "*"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test here is async; opting in per-test adds noise and is easy to forget.
asyncio_mode = "auto"
# One event loop for the whole session: the SQLAlchemy engine is created at
# import time and its asyncpg connections are bound to the loop that opened
# them, so per-test loops would poison the pool between tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
