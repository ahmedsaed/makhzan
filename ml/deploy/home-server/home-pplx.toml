# home-pplx: pplx-decider-flash-v1.3 Q4_K_S on the home server's AMD card through llama.cpp,
# 05:05-07:00 Cairo time, waiting between windows. Production since 2026-11-27
# (docs/ai/decision-review.md, "Production switch"). Its judge is the "pplx" model of the
# stack's llama.cpp router (compose.yml, service "llamacpp"), which this worker loads on its
# window's first lease with jobs: the 4 GB card holds one model, and the router swaps Kev's out.
#
# No CPU fallback is set up: the router runs only on the card (-dev Vulkan0, its guard requires
# the clock limit), so a CPU run of the same GGUF would need its own llama.cpp server
# (docs/ai/worker.md, "pplx on a llama.cpp sidecar").
[worker]
name = "home-pplx"
broker_url = "http://broker-proxy:8100/ai/v1"
broker_via_proxy = true
token_file = "/run/secrets/makhzan-ai-token"
model = "pplx"

[model.pplx]
expect_version = "pplx-decider-flash-v1.3-Q4_K_S@819a9ad0f8f4+llama.cpp-b12767-87d189d403fd+T1.3303"

[compute]
backend = "llamacpp"
device = "gpu"
dtype = "q4_k_s"
llamacpp_url = "http://llamacpp:8080"
# The same file the router serves, mounted read-only into the worker too: it is checked
# against the pin (sha256, decision type, temperature) before anything is scored.
gguf_path = "/models/pplx-flash-v1.3-Q4_K_S.gguf"
# Refuse to load unless the card's clock limit is applied (re-read at every load).
require_clock_limit = true
nice = 10

[schedule]
# After Kev's window: the card holds one model, and the router swaps pplx in when this one asks.
windows = ["05:05-07:00"]
timezone = "Africa/Cairo"
outside_window = "wait"
on_empty = "exit"

[leases]
max_jobs = 2
lease_s = 900
heartbeat_s = 60
