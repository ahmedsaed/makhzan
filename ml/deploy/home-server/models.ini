; The llama.cpp router's models (compose.yml, service "llamacpp"): one server for both judges,
; one model loaded at a time (--models-max 1; the AMD card has 4 GB, each model ~3.3 GB). Each
; worker asks for its own by name at the start of its window (H2O 01:00, pplx 05:05) and the
; router swaps it in; idle, it sleeps (--sleep-idle-seconds), freeing the card by day.
; The settings are the ones soaked on the card at clock states 0-2 (docs/ai/kev-llamacpp.md).
version = 1

[*]
n-gpu-layers = 99
parallel = 1

; H2O-Lightning-4B Q4_K_M, the first judge since D25 (2026-11-27): causal, 512-token batches as
; Kev's were. 2048 measured ~3.2 GB on the desktop 3060 and 3.1x the speed: a candidate for the
; card, not yet tested on it (README.md).
[h2o]
model = /models/h2o-lightning-4b-Q4_K_M.gguf
c = 4096
b = 512
ub = 512

; Kev-4B Q4_K_M: the first judge until D25, kept for its rollback; nothing asks for it.
[kev]
model = /models/Kev-4B-Q4_K_M.gguf
c = 4096
b = 512
ub = 512

; pplx-decider-flash-v1.3 Q4_K_S: non-causal, so a whole request in one batch (the longest
; Phase E request is 3,574 tokens), with flash attention.
[pplx]
model = /models/pplx-flash-v1.3-Q4_K_S.gguf
c = 4096
b = 4096
ub = 4096
flash-attn = on
