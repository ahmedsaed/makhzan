# llamacpp-kev: Kev-4B Q4_K_M on the home server's AMD card, through the compose stack's
# kev-llamacpp sidecar (compose.yml, profile "llamacpp"). NOT IN USE: to switch, point the kev
# service's worker.toml mount at this file and start the profile. The broker refuses this
# version until the policy names it (an owner step; docs/ai/kev-llamacpp.md).
[worker]
name = "home-kev"
broker_url = "http://broker-proxy:8100/ai/v1"
broker_via_proxy = true
token_file = "/run/secrets/makhzan-ai-token"
model = "kev"

[model.kev]
expect_version = "kev-4b-Q4_K_M@33ae6b189265+llama.cpp-b12767-87d189d403fd+T1.0"

[compute]
backend = "llamacpp"
device = "gpu"
dtype = "q4_k_m"
llamacpp_url = "http://kev-llamacpp:8080"
# The same file the sidecar serves, mounted read-only into the worker too: it is checked
# against the pin (sha256, decision type, temperature) before anything is scored.
gguf_path = "/models/Kev-4B-Q4_K_M.gguf"
nice = 10

[schedule]
windows = ["01:00-05:00"]
timezone = "Africa/Cairo"
outside_window = "wait"
on_empty = "exit"

[leases]
# About 5 s a request on the card: 2 jobs (4 requests) take about 20 s.
max_jobs = 2
lease_s = 900
heartbeat_s = 60
