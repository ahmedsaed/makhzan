# home-kev: Kev-4B Q4_K_M on the home server's AMD card through llama.cpp, 01:00-05:00 Cairo time,
# waiting between windows. Production since 2026-11-27 (docs/ai/decision-review.md, "Production
# switch"). Its judge is the "kev" model of the stack's llama.cpp router (compose.yml, service
# "llamacpp"), which this worker loads on its window's first lease with jobs: the 4 GB card holds
# one model, and
# pplx's worker swaps it out at 05:05.
[worker]
name = "home-kev"
broker_url = "http://broker-proxy:8100/ai/v1"
broker_via_proxy = true
token_file = "/run/secrets/makhzan-ai-token"
model = "kev"

[model.kev]
expect_version = "kev-4b-Q4_K_M@33ae6b189265+llama.cpp-b12767-87d189d403fd+T1.0"

[compute]
backend = "llamacpp"
device = "gpu"
dtype = "q4_k_m"
llamacpp_url = "http://llamacpp:8080"
# The same file the router serves, mounted read-only into the worker too: it is checked
# against the pin (sha256, decision type, temperature) before anything is scored.
gguf_path = "/models/Kev-4B-Q4_K_M.gguf"
# Refuse to load unless the card's clock limit is applied (re-read at every load).
require_clock_limit = true
nice = 10

[schedule]
windows = ["01:00-05:00"]
timezone = "Africa/Cairo"
outside_window = "wait"
on_empty = "exit"

[leases]
# About 5 s a request on the card: 2 jobs (4 requests) take about 20 s.
max_jobs = 2
lease_s = 900
heartbeat_s = 60
