# llamacpp-pplx: pplx-decider-flash-v1.3 Q4_K_S on the home server's CPU, through the compose
# stack's pplx-llamacpp sidecar (compose.yml, profile "llamacpp-pplx"). NOT IN USE: to switch,
# point the pplx service's worker.toml mount at this file and start the profile. The broker
# refuses this version until the policy names it (an owner step; docs/ai/pplx-llamacpp.md).
[worker]
name = "home-pplx"
broker_url = "http://broker-proxy:8100/ai/v1"
broker_via_proxy = true
token_file = "/run/secrets/makhzan-ai-token"
model = "pplx"

[model.pplx]
expect_version = "pplx-decider-flash-v1.3-Q4_K_S@819a9ad0f8f4+llama.cpp-b12767-87d189d403fd+T1.3303"

[compute]
backend = "llamacpp"
device = "cpu"
dtype = "q4_k_s"
llamacpp_url = "http://pplx-llamacpp:8080"
# The same file the sidecar serves, mounted read-only into the worker too: it is checked
# against the pin (sha256, decision type, temperature) before anything is scored.
gguf_path = "/models/pplx-flash-v1.3-Q4_K_S.gguf"
nice = 10

[schedule]
# Today's window, unchanged. With Kev on the card the CPU is free all night, so a wider window
# (running beside Kev) is possible; that is the owner's call, not made here.
windows = ["05:05-07:00"]
timezone = "Africa/Cairo"
outside_window = "wait"
on_empty = "exit"

[leases]
max_jobs = 2
lease_s = 900
heartbeat_s = 60
