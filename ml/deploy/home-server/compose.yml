# The home server's AI-matching workers: this file, a .env, two worker TOMLs, two token files,
# the llama.cpp router's preset (models.ini) and guard (llamacpp-guard.sh), and the GGUFs. Everything
# runs in this stack: no host timers, scripts or firewall rules. The host's one setting is the udev
# rule 99-amdgpu-clock-limit.rules, which holds the AMD card to its safe clock states (README.md).
# README.md beside this file says how to set it up; docs/ai/worker.md is the reference.
#
# Production (owner, 2026-11-27): both judges run on the AMD card through one llama.cpp router
# (service "llamacpp"), which serves both models and holds one at a time (the 4 GB card fits one).
# Since D25 (2026-11-27) the first judge is H2O-Lightning (service "h2o"), replacing Kev; the
# router still lists Kev for the rollback, and nothing asks for it.
# Each worker asks for its own model on its window's first lease with jobs and the router swaps it
# in; idle, the
# model sleeps and the card is free for other users. The router refuses to start unless the
# card's clock limit is applied (llamacpp-guard.sh).
#
#   docker compose up -d                              # start (and after every change)
#   docker compose pull && docker compose up -d       # update to the latest tested images
#   docker compose logs -f h2o                        # watch a worker
#
# Each worker stays up and waits for its own window (outside_window = "wait" in its TOML):
# H2O 06:00-10:00, pplx 10:05-12:00, Africa/Cairo. Each window's session runs in a child
# process that exits at the window's end. The windows never overlap. Never point anything else at
# the router during a window (a parity run, a request for the other model): it evicts the window's
# model and the two swap back and forth, each swap re-reading ~3 GB from disk (README.md).
#
# Network: the workers sit on `broker-only`, an internal network with no route anywhere.
# Their one way out is `broker-proxy`, our own TCP forwarder (makhzan_ml.worker.proxy), which
# joins that network to an ordinary bridge and forwards one port to the broker's Tailscale
# address, and to nothing else.

name: makhzan-ai

x-hardening: &hardening
  restart: unless-stopped
  init: true
  user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-worker: &worker
  <<: *hardening
  # The owner's caps: 6 CPUs at a low share (anything else on the machine wins contention),
  # 20 GB of memory and no swap, a small writable /tmp only.
  cpus: 6
  cpu_shares: 256
  mem_limit: 20g
  memswap_limit: 20g
  tmpfs:
    - /tmp:size=256m
  # Covers the graceful stop's bound on this CPU (docs/ai/worker.md, "A stop sets one
  # deadline"): a request or a model load in flight, then the last posts.
  stop_grace_period: 240s
  pids_limit: 256
  environment:
    HOME: /tmp
    # Log timestamps only: the windows are read in the TOML's own `timezone`.
    TZ: Africa/Cairo
  networks: [broker-only]
  depends_on: [broker-proxy]

services:
  broker-proxy:
    <<: *hardening
    # The worker image, for the proxy module only: no model is loaded, nothing else runs.
    image: ${H2O_IMAGE:-ghcr.io/ahmedsaed/makhzan/worker-llamacpp:latest}
    entrypoint: ["python", "-m", "makhzan_ml.worker.proxy"]
    # Listens on its address on the workers' internal network only, never on the egress
    # bridge, so nothing outside the stack can use it.
    command:
      - --listen
      - ${PROXY_ADDRESS:-10.231.89.2}:8100
      - --to
      - ${BROKER_TARGET:?set BROKER_TARGET in .env}
    environment:
      TZ: Africa/Cairo  # log timestamps, as the workers'
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    networks:
      broker-only:
        ipv4_address: ${PROXY_ADDRESS:-10.231.89.2}
      egress: {}

  h2o:
    <<: *worker
    # The slim llama.cpp worker (no torch, ~180 MB; ml/worker-llamacpp.Dockerfile), serving the
    # first judge, H2O-Lightning (D25). H2O has no torch build; a rollback to Kev is README.md's.
    image: ${H2O_IMAGE:-ghcr.io/ahmedsaed/makhzan/worker-llamacpp:latest}
    volumes:
      - ${WEIGHTS_DIR:?set WEIGHTS_DIR in .env}:/models:ro
      - ${WORKER_DIR:?set WORKER_DIR in .env}/home-h2o.toml:/etc/makhzan-ai/worker.toml:ro
      - ${WORKER_DIR:?set WORKER_DIR in .env}/home-h2o.token:/run/secrets/makhzan-ai-token:ro

  pplx:
    <<: *worker
    image: ${PPLX_IMAGE:-ghcr.io/ahmedsaed/makhzan/worker-llamacpp:latest}
    # Above the anchor's 240 s for a CPU llama.cpp server (not set up here; home-pplx.toml): its
    # longest request on this CPU is about 193 s (estimated) and may run to its 225 s timeout, then
    # 3 x 10 s of last posts and a 10 s join (265 s). On the card (production) a request is at
    # most 60 s, far inside it.
    stop_grace_period: 300s
    volumes:
      - ${WEIGHTS_DIR:?set WEIGHTS_DIR in .env}:/models:ro
      - ${WORKER_DIR:?set WORKER_DIR in .env}/home-pplx.toml:/etc/makhzan-ai/worker.toml:ro
      - ${WORKER_DIR:?set WORKER_DIR in .env}/home-pplx.token:/run/secrets/makhzan-ai-token:ro

  # Both judges on the AMD card through llama.cpp's router mode (docs/ai/kev-llamacpp.md,
  # docs/ai/pplx-llamacpp.md): one llama-server serving Kev-4B Q4_K_M and pplx Q4_K_S from the
  # preset models.ini, at most one loaded at a time (--models-max 1), loaded on demand by the
  # request's model name, asleep after 10 idle minutes (the card is free by day). The workers
  # reach it as http://llamacpp:8080 and load their own model before their window's first lease.
  llamacpp:
    <<: *hardening
    # llama.cpp's official server-vulkan image, build b12767, by digest (pins.LLAMACPP_IMAGE).
    image: ghcr.io/ggml-org/llama.cpp@sha256:87d189d403fda2a612a23c9dcd35c482967f48586e93d812a01e7a1f5e3a1486
    # The guard refuses to start unless the card is held to its safe clock states (the host's
    # udev rule): a refusal repeats under restart: unless-stopped, a loop with its message in
    # `docker compose logs llamacpp`, never an unlimited card. It then runs llama-server.
    entrypoint: ["/bin/sh", "/cfg/llamacpp-guard.sh"]
    command:
      - --models-preset
      - /cfg/models.ini
      - --models-max
      - "1"
      - --sleep-idle-seconds
      - "600"
      # Only the card: without it llama.cpp silently falls back to the CPU when the card cannot be
      # opened (missing render/video groups), while the workers record device "gpu". With it, no
      # card is a startup error ("invalid device: Vulkan0").
      - -dev
      - Vulkan0
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    # The host's render and video group ids (`getent group render video`), set in .env, so the
    # non-root user can open the card.
    group_add:
      - "${RENDER_GID:?set RENDER_GID in .env (getent group render)}"
      - "${VIDEO_GID:?set VIDEO_GID in .env (getent group video)}"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${WORKER_DIR:?set WORKER_DIR in .env}/models.ini:/cfg/models.ini:ro
      - ${WORKER_DIR:?set WORKER_DIR in .env}/llamacpp-guard.sh:/cfg/llamacpp-guard.sh:ro
      # The files in WEIGHTS_DIR, the workers' own /models mount, so each pair reads one file.
      - ${WEIGHTS_DIR:?set WEIGHTS_DIR in .env}/h2o-lightning-4b-Q4_K_M.gguf:/models/h2o-lightning-4b-Q4_K_M.gguf:ro
      # Kev's, for the rollback of D25 only (README.md): the router lists it, nothing asks for it.
      - ${WEIGHTS_DIR:?set WEIGHTS_DIR in .env}/Kev-4B-Q4_K_M.gguf:/models/Kev-4B-Q4_K_M.gguf:ro
      - ${WEIGHTS_DIR:?set WEIGHTS_DIR in .env}/pplx-flash-v1.3-Q4_K_S.gguf:/models/pplx-flash-v1.3-Q4_K_S.gguf:ro
    tmpfs:
      - /tmp:size=64m
    environment:
      HOME: /tmp
    # The router and at most one model instance; each GGUF is memory-mapped (~3 GB of page
    # cache the cgroup counts but can reclaim).
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 128
    # Not published to the host, and on the workers' internal network only. From there it could
    # reach broker-proxy:8100, as any worker can, which forwards only to the broker; without a
    # token the broker refuses it. Nothing else.
    networks: [broker-only]

networks:
  # No egress: Docker drops anything leaving an internal network. It still gives the host an
  # address on the bridge, though, so a container could reach host services listening on all
  # interfaces (sshd, a database); inhibit_ipv4 leaves the host without one (README.md says
  # how to check it took).
  broker-only:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    # A fixed subnet, so the proxy can listen on a fixed address in it (.env can move both).
    # `ip_range` keeps every address Docker hands out itself in the upper half, away from the
    # proxy's: inhibit_ipv4 leaves no gateway, so without it the first worker to attach took
    # .1 and the second .2, and the proxy then failed with "Address already in use" and
    # stayed down (2026-11-24, two nights unscored). PROXY_ADDRESS must stay outside it.
    ipam:
      config:
        - subnet: ${BROKER_NET_SUBNET:-10.231.89.0/24}
          ip_range: ${BROKER_NET_DYNAMIC:-10.231.89.128/25}
  # An ordinary bridge, for the proxy alone.
  egress: {}
